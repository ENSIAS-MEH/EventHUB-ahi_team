name: CI/CD — Tests + Build + Push

on:
  push:
    branches: [ feature/anas, main ]
  pull_request:
    branches: [ main ]

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 1 — Tests unitaires (les 3 services en parallèle)
  # ─────────────────────────────────────────────────────────────────────────────

  test-auth-service:
    name: Tests — auth-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Lancer les tests unitaires
        run: mvn test --no-transfer-progress
        working-directory: backend/auth-service

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-auth
          path: backend/auth-service/target/surefire-reports/
          retention-days: 1

  test-event-service:
    name: Tests — event-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Lancer les tests unitaires
        run: mvn test --no-transfer-progress
        working-directory: backend/event-service

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-event
          path: backend/event-service/target/surefire-reports/
          retention-days: 1

  test-booking-service:
    name: Tests — booking-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Lancer les tests unitaires
        run: mvn test --no-transfer-progress
        working-directory: backend/booking-service

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-booking
          path: backend/booking-service/target/surefire-reports/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 2 — Build & Push Docker Hub (seulement si tous les tests passent)
  # ─────────────────────────────────────────────────────────────────────────────

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [ test-auth-service, test-event-service, test-booking-service ]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/anas'

    steps:
      - uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/auth-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/auth-service:latest

      - name: Build & Push event-service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/event-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/event-service:latest

      - name: Build & Push booking-service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/booking-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/booking-service:latest

      - name: Build & Push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./backend/api-gateway
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest

      - name: Build & Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/frontend:latest
