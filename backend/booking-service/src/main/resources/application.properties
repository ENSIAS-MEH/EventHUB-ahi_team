server.port=8083
spring.application.name=booking-service
spring.datasource.url=jdbc:mysql://mysql-server:3306/db_booking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
event.service.url=${EVENT_SERVICE_URL:http://event-service:8082}

jwt.secret=${JWT_SECRET:eventhub-super-secret-jwt-key-2024-XXXXXXXXXXXXXXXXXXXXXXXXXX}

management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

