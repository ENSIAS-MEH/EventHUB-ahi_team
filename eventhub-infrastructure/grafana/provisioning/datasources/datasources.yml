apiVersion: 1

datasources:
  # Prometheus — métriques (CPU, RAM, latence, requêtes)
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # Loki — logs JSON structurés
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        # Lien cliquable : traceId dans les logs → trace complète dans Zipkin
        - datasourceUid: zipkin
          matcherRegex: '"traceId"\s*:\s*"(\w+)"'
          name: TraceID
          url: 'http://localhost:9411/zipkin/traces/${__value.raw}'

  # Zipkin — traces distribuées
  - name: Zipkin
    type: zipkin
    uid: zipkin
    access: proxy
    url: http://zipkin:9411
    editable: false
