services:
  # 1. La Base de Données
  mysql-server:
    image: mysql:8.0
    container_name: eventhub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s

  # 2. Le service d'Authentification
  auth-service:
    build: ../backend/auth-service
    container_name: auth-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-server:3306/db_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - JWT_SECRET=eventhub-super-secret-jwt-key-2024-XXXXXXXXXXXXXXXXXXXXXXXXXX
    depends_on:
      mysql-server:
        condition: service_healthy
    restart: on-failure

  # 3. Le service des Événements
  event-service:
    build: ../backend/event-service
    container_name: event-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-server:3306/db_event?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - UPLOAD_DIR=/app/uploads
      - UPLOAD_BASE_URL=http://localhost:8000
      - JWT_SECRET=eventhub-super-secret-jwt-key-2024-XXXXXXXXXXXXXXXXXXXXXXXXXX
    volumes:
      - event-uploads:/app/uploads
    depends_on:
      mysql-server:
        condition: service_healthy
    restart: on-failure

  # 4. Le service de Réservation
  booking-service:
    build: ../backend/booking-service
    container_name: booking-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-server:3306/db_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - EVENT_SERVICE_URL=http://event-service:8082
      - JWT_SECRET=eventhub-super-secret-jwt-key-2024-XXXXXXXXXXXXXXXXXXXXXXXXXX
    depends_on:
      mysql-server:
        condition: service_healthy
    restart: on-failure

  # 5. L'API Gateway — point d'entrée unique pour le frontend
  api-gateway:
    build: ../backend/api-gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    depends_on:
      auth-service:
        condition: service_started
      event-service:
        condition: service_started
      booking-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: on-failure

  # 6. Le Frontend React
  frontend:
    build: ../frontend
    container_name: eventhub-frontend
    ports:
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: on-failure

  # 7. phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    ports:
      - "8090:80"
    environment:
      - PMA_HOST=mysql-server
      - PMA_USER=root
      - PMA_PASSWORD=rootpassword
    depends_on:
      - mysql-server

  # 8. Prometheus — collecte des métriques
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - auth-service
      - event-service
      - booking-service
      - api-gateway
    restart: on-failure

  # 9. Grafana — dashboards visuels
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: on-failure

  # 10. Loki — agrégation des logs JSON
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: on-failure

  # 11. Promtail — collecte des logs Docker
  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: on-failure

  # 12. Zipkin — traces distribuées
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    restart: on-failure

volumes:
  event-uploads:
  mysql_data:
  grafana_data:
