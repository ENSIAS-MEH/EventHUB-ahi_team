services:
  # 1. La Base de Données
  mysql-server:
    image: mysql:8.0
    container_name: eventhub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s

  # 2. L'Annuaire Eureka
  eureka-server:
    build: ../backend/eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 40s

  # 3. Le service d'Authentification
  auth-service:
    build: ../backend/auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-server:3306/db_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JWT_SECRET=eventhub-super-secret-jwt-key-2024-XXXXXXXXXXXXXXXXXXXXXXXXXX
    depends_on:
      mysql-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: on-failure

  # 4. Le service des Événements
  event-service:
    build: ../backend/event-service
    container_name: event-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-server:3306/db_event?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - UPLOAD_DIR=/app/uploads
      - UPLOAD_BASE_URL=http://localhost:8082
      - JWT_SECRET=eventhub-super-secret-jwt-key-2024-XXXXXXXXXXXXXXXXXXXXXXXXXX
    volumes:
      - event-uploads:/app/uploads
    depends_on:
      mysql-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: on-failure

  # 5. Le service de Réservation
  booking-service:
    build: ../backend/booking-service
    container_name: booking-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-server:3306/db_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EVENT_SERVICE_URL=http://event-service:8082
      - JWT_SECRET=eventhub-super-secret-jwt-key-2024-XXXXXXXXXXXXXXXXXXXXXXXXXX
    depends_on:
      mysql-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: on-failure

  # 6. Le Frontend React
  frontend:
    build: ../frontend
    container_name: eventhub-frontend
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - event-service
      - booking-service
    restart: on-failure

  # 7. phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    ports:
      - "8090:80"
    environment:
      - PMA_HOST=mysql-server
      - PMA_USER=root
      - PMA_PASSWORD=rootpassword
    depends_on:
      - mysql-server

volumes:
  event-uploads:
  mysql_data: